plugins {
    id 'com.android.application'
}

android {
    namespace 'com.keeppolicial.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.keeppolicial.app'
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName '3.0'
    }

    buildFeatures {
        buildConfig true
    }

    // Chave definitiva do app (a partir da 3.0). Fica FORA do repositório, em
    // ~/.keeppolicial/assinatura.properties (ou no caminho da variável KEEP_ASSINATURA).
    // Toda versão tem de ser assinada com ela, senão os celulares não aceitam a
    // atualização automática. Guarde cópias do .jks e do .properties.
    def arqAssinatura = new File(System.getenv('KEEP_ASSINATURA')
            ?: System.getProperty('user.home') + '/.keeppolicial/assinatura.properties')
    signingConfigs {
        if (arqAssinatura.exists()) {
            definitiva {
                def p = new Properties()
                arqAssinatura.withInputStream { p.load(it) }
                storeFile file(p['storeFile'])
                storePassword p['storePassword']
                keyAlias p['keyAlias']
                keyPassword p['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (!arqAssinatura.exists()) {
                throw new GradleException("Chave de assinatura não encontrada: " + arqAssinatura +
                        ". Restaure a cópia de segurança (veja COMO_INSTALAR.md).")
            }
            signingConfig signingConfigs.definitiva
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
