plugins {
    id 'com.android.application'
}

android {
    namespace 'com.keeppolicial.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.keeppolicial.app'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '2.0'
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            // Assinado com a chave de depuração para instalação direta (sem loja).
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
